<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Hearth" />
<meta name="theme-color" content="#FAF9F5" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" href="manifest.json" />
<title>Hearth — Pantry</title>
<style>
:root {
  --bg: #FAF9F5;
  --surface: #FFFFFF;
  --surface-2: #F1EFE8;
  --text: #1B1B19;
  --text-2: #5F5E5A;
  --text-3: #888780;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.15);
  --info-bg: #E6F1FB;
  --info-text: #185FA5;
  --info-border: #B5D4F4;
  --urgent-bg: #FCEBEB;
  --urgent-text: #A32D2D;
  --urgent-deep: #501313;
  --urgent-pill: #F7C1C1;
  --soon-bg: #FAEEDA;
  --soon-text: #854F0B;
  --soon-deep: #412402;
  --soon-pill: #FAC775;
  --ok-bg: #EAF3DE;
  --ok-text: #27500A;
  --ok-pill: #C0DD97;
  --radius: 12px;
  --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1B1B19;
    --surface: #262624;
    --surface-2: #2C2C2A;
    --text: #F1EFE8;
    --text-2: #B4B2A9;
    --text-3: #888780;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --info-bg: #042C53;
    --info-text: #85B7EB;
    --info-border: #185FA5;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
header { padding: 16px 20px 12px; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
.count { font-size: 12px; color: var(--text-3); }
main { flex: 1; padding: 16px 20px 80px; }
.screen { display: none; }
.screen.active { display: block; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius-sm); margin-bottom: 8px; }
.row-main { flex: 1; min-width: 0; padding-right: 8px; }
.row-name { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
.row-sub { font-size: 12px; color: var(--text-2); }
.bdg { font-size: 11px; padding: 4px 9px; border-radius: 10px; white-space: nowrap; font-weight: 500; }
.u { background: var(--urgent-pill); color: var(--urgent-deep); }
.s { background: var(--soon-pill); color: var(--soon-deep); }
.k { background: var(--ok-pill); color: var(--ok-text); }
.l { background: var(--surface-2); color: var(--text-3); border: 0.5px solid var(--border); }
.pills { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 6px 14px; border-radius: 14px; cursor: pointer; background: var(--surface-2); color: var(--text-2); border: none; font-family: inherit; }
.pill.active { background: var(--info-bg); color: var(--info-text); }
.ib { background: none; border: none; padding: 6px; color: var(--text-3); cursor: pointer; }
.ib:active { transform: scale(0.92); }
.btn { width: 100%; padding: 12px; background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; font-family: inherit; cursor: pointer; }
.btn:active { background: var(--surface-2); }
.btn-primary { background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); }
.row-actions { display: flex; align-items: center; gap: 8px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 0.5px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 10; max-width: 480px; margin: 0 auto; }
.tab { background: none; border: none; padding: 8px 4px; color: var(--text-3); font-size: 10px; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tab.active { color: var(--info-text); }
.tab i { font-size: 20px; }
.dz { border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 36px 20px; text-align: center; background: var(--surface-2); cursor: pointer; }
.empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: 14px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
.modal { background: var(--surface); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
.fl { font-size: 12px; color: var(--text-2); margin-bottom: 6px; display: block; }
input, select, textarea { width: 100%; padding: 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 16px; font-family: inherit; margin-bottom: 12px; }
input:focus, select:focus { outline: none; border-color: var(--info-text); }
.modal h2 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
.recipe-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.recipe-head { display: flex; justify-content: space-between; align-items: start; margin-bottom: 4px; }
.recipe-name { font-size: 15px; font-weight: 500; }
.recipe-tag { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: var(--ok-bg); color: var(--ok-text); }
.recipe-sub { font-size: 12px; color: var(--text-2); }
.exp-card { border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; }
.shop-row { display: flex; align-items: center; padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius-sm); margin-bottom: 8px; gap: 10px; }
.shop-row.done .shop-text { text-decoration: line-through; color: var(--text-3); }
.shop-text { flex: 1; font-size: 15px; }
.reset { display: block; margin: 20px auto 0; font-size: 11px; color: var(--text-3); background: none; border: none; padding: 6px 12px; cursor: pointer; }
.scan-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.scan-name { font-size: 14px; font-weight: 500; }
.scan-raw { font-size: 11px; color: var(--text-3); font-family: ui-monospace, monospace; margin-top: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
</head>
<body>
<div class="app">
<header>
<h1>Hearth</h1>
<div class="count" id="cnt">0 items</div>
</header>

<main>
<section id="scr-home" class="screen active">
<div class="pills">
<button class="pill active" data-f="all">All</button>
<button class="pill" data-f="Fridge">Fridge</button>
<button class="pill" data-f="Pantry">Pantry</button>
<button class="pill" data-f="Freezer">Freezer</button>
</div>
<div id="items"></div>
<button id="add" class="btn" style="margin-top: 8px;"><i class="ti ti-plus"></i> Add item</button>
</section>

<section id="scr-scan" class="screen">
<p style="font-size: 14px; color: var(--text-2); margin: 0 0 14px;">Snap or upload a receipt</p>
<div id="dz" class="dz">
<i class="ti ti-camera" style="font-size: 36px; color: var(--text-3);"></i>
<div style="font-size: 14px; margin-top: 10px;">Tap to simulate receipt scan</div>
<div style="font-size: 12px; color: var(--text-3); margin-top: 4px;">sample receipt — real OCR coming next</div>
</div>
<div id="scan-out" style="margin-top: 16px;"></div>
</section>

<section id="scr-exp" class="screen">
<p style="font-size: 14px; color: var(--text-2); margin: 0 0 14px;">Use these soon</p>
<div id="exp-list"></div>
</section>

<section id="scr-rec" class="screen">
<p style="font-size: 14px; color: var(--text-2); margin: 0 0 14px;">Recipes from your pantry</p>
<div id="rec-list"></div>
</section>

<section id="scr-list" class="screen">
<p style="font-size: 14px; color: var(--text-2); margin: 0 0 14px;">Shopping list</p>
<div style="display: flex; gap: 8px; margin-bottom: 14px;">
<input id="si" type="text" placeholder="Add to list..." style="flex: 1; margin: 0;" />
<button id="sa" class="btn" style="width: auto; padding: 12px 16px;"><i class="ti ti-plus"></i></button>
</div>
<div id="slist"></div>
</section>

<button class="reset" id="rst">Reset demo data</button>
</main>

<nav>
<button class="tab active" data-s="home"><i class="ti ti-home"></i><span>Pantry</span></button>
<button class="tab" data-s="scan"><i class="ti ti-camera"></i><span>Scan</span></button>
<button class="tab" data-s="exp"><i class="ti ti-clock"></i><span>Soon</span></button>
<button class="tab" data-s="rec"><i class="ti ti-chef-hat"></i><span>Recipes</span></button>
<button class="tab" data-s="list"><i class="ti ti-list"></i><span>List</span></button>
</nav>

<div id="mc"></div>
</div>

<script src="app.js"></script>
</body>
</html>
